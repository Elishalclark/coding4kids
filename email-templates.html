<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Email Templates - KidVibers Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=219" />
  <style>
    /* Not included: analytics.js. This page can show real correspondence copy and is only
       for the account owner — deliberately kept out of any session-recording/analytics tool. */
    body { background: #0c0a18; }
    .et-wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 90px; }
    .et-hero { text-align:center; margin-bottom:24px; }
    .et-hero h1 { font-size:1.8rem; font-weight:900; color:#fff; }
    .et-hero p { color:#a5a0c0; margin-top:6px; }
    .et-login { max-width:360px; margin:80px auto; background:#161327; border:1px solid rgba(167,139,250,.25); border-radius:16px; padding:28px; }
    .et-login h2 { color:#fff; font-weight:900; margin-bottom:14px; text-align:center; }
    .et-login input { width:100%; box-sizing:border-box; padding:11px 14px; border-radius:10px; border:1px solid rgba(167,139,250,.3); background:#0c0a18; color:#fff; font-family:inherit; margin-bottom:10px; }
    .et-login button { width:100%; padding:11px; border:none; border-radius:10px; background:linear-gradient(135deg,#7c3aed,#db2777); color:#fff; font-weight:900; cursor:pointer; }
    .et-login .err { color:#f87171; font-size:0.85rem; margin-top:8px; text-align:center; min-height:1.2em; }
    .et-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .et-tab { background:#161327; border:1px solid rgba(167,139,250,.25); color:#c4b5fd; border-radius:50px; padding:8px 16px; font-weight:800; font-size:0.85rem; cursor:pointer; }
    .et-tab.active { background:linear-gradient(135deg,#7c3aed,#db2777); color:#fff; border-color:transparent; }
    .et-card { background:#161327; border:1px solid rgba(167,139,250,.25); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
    .et-card.featured { border-color:rgba(251,191,36,.5); background:linear-gradient(160deg,#1c1533,#161327); }
    .et-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
    .et-title { color:#fff; font-weight:900; font-size:1.05rem; }
    .et-cat { display:inline-block; font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#a78bfa; background:rgba(124,58,237,.15); border-radius:6px; padding:2px 8px; margin-left:8px; vertical-align:middle; }
    .et-field-label { color:#6f6890; font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin-top:12px; }
    .et-subject { color:#e6dcff; font-weight:700; margin-top:4px; }
    .et-body { color:#c9c3e0; white-space:pre-wrap; font-size:0.92rem; line-height:1.6; margin-top:4px; max-height:280px; overflow-y:auto; background:#0c0a18; border-radius:10px; padding:12px 14px; }
    .et-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .et-btn { background:rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.3); color:#c4b5fd; border-radius:8px; padding:7px 14px; font-weight:800; font-size:0.8rem; cursor:pointer; font-family:inherit; }
    .et-btn:hover { background:rgba(167,139,250,.22); }
    .et-btn.copied { background:rgba(74,222,128,.18); border-color:rgba(74,222,128,.4); color:#4ade80; }
    .et-tip { background:rgba(124,58,237,.1); border:1px solid rgba(167,139,250,.25); border-radius:10px; padding:12px 16px; color:#c4b5fd; font-size:0.85rem; margin-bottom:20px; }
  </style>
</head>
<body>
  <div class="et-wrap">
    <div id="etLoginBox" class="et-login" style="display:none;">
      <h2>🔐 Super Admin Sign-In</h2>
      <input id="etUser" placeholder="Username" autocomplete="username" />
      <input id="etPass" type="password" placeholder="Password" autocomplete="current-password" />
      <button onclick="etLogin()">Sign In</button>
      <div class="err" id="etLoginErr"></div>
    </div>

    <div id="etContent" style="display:none;">
      <div class="et-hero">
        <h1>✉️ Email Templates</h1>
        <p>Ready-to-send copy for KidVibers. Copy the subject and body straight into your email client.</p>
      </div>
      <div class="et-tip">💡 Some templates use placeholders like <code>{name}</code>, <code>{resetLink}</code>, or <code>{replyBody}</code> — swap those out before sending.</div>
      <div class="et-tabs" id="etTabs"></div>
      <div id="etList"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let TEMPLATES = [];
    let ACTIVE_TAB = 'all';
    const CATS = { all: 'All', featured: '⭐ Featured', marketing: 'Marketing', personal: 'Personal',
                   business: 'Business', passwords: 'Passwords', support: 'Support' };

    async function etLogin() {
      const err = document.getElementById('etLoginErr');
      const u = document.getElementById('etUser').value.trim();
      const p = document.getElementById('etPass').value;
      if (!u || !p) { err.textContent = 'Enter a username and password.'; return; }
      const { ok, data } = await C4K.adminLogin(u, p);
      if (!ok) { err.textContent = data.error || 'Login failed.'; return; }
      if (!C4K.user || C4K.user.role !== 'super_admin') { err.textContent = 'This page is super-admin only.'; C4K.setToken(null); return; }
      init();
    }

    function renderTabs() {
      document.getElementById('etTabs').innerHTML = Object.entries(CATS).map(([k, label]) =>
        `<button class="et-tab ${k === ACTIVE_TAB ? 'active' : ''}" onclick="setTab('${k}')">${label}</button>`).join('');
    }
    function setTab(k) { ACTIVE_TAB = k; renderTabs(); renderList(); }

    function renderList() {
      const list = ACTIVE_TAB === 'all' ? TEMPLATES
        : ACTIVE_TAB === 'featured' ? TEMPLATES.filter(t => t.featured)
        : TEMPLATES.filter(t => t.category === ACTIVE_TAB);
      document.getElementById('etList').innerHTML = list.map((t, i) => `
        <div class="et-card ${t.featured ? 'featured' : ''}">
          <div class="et-card-top">
            <div class="et-title">${t.featured ? '⭐ ' : ''}${esc(t.title)}<span class="et-cat">${esc(CATS[t.category] || t.category)}</span></div>
          </div>
          <div class="et-field-label">Subject</div>
          <div class="et-subject" id="etSubj_${i}">${esc(t.subject)}</div>
          <div class="et-field-label">Body</div>
          <div class="et-body" id="etBody_${i}">${esc(t.body)}</div>
          <div class="et-btns">
            <button class="et-btn" onclick="copyText(this,'etSubj_${i}')">📋 Copy subject</button>
            <button class="et-btn" onclick="copyText(this,'etBody_${i}')">📋 Copy body</button>
            <button class="et-btn" onclick="copyBoth(this, ${i})">📋 Copy both</button>
          </div>
        </div>`).join('') || '<p style="color:#6f6890;">Nothing in this category.</p>';
    }

    function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function flash(btn) {
      const old = btn.textContent;
      btn.textContent = '✅ Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    }
    function copyText(btn, elId) {
      const text = document.getElementById(elId).textContent;
      navigator.clipboard.writeText(text).then(() => flash(btn)).catch(() => prompt('Copy:', text));
    }
    function copyBoth(btn, i) {
      const subj = document.getElementById('etSubj_' + i).textContent;
      const body = document.getElementById('etBody_' + i).textContent;
      const text = `Subject: ${subj}\n\n${body}`;
      navigator.clipboard.writeText(text).then(() => flash(btn)).catch(() => prompt('Copy:', text));
    }

    async function init() {
      document.getElementById('etLoginBox').style.display = 'none';
      document.getElementById('etContent').style.display = '';
      const { ok, data } = await C4K.api('/api/admin/email-templates');
      if (!ok) { document.getElementById('etList').innerHTML = `<p style="color:#f87171;">${esc(data.error || 'Could not load templates.')}</p>`; return; }
      TEMPLATES = data.templates;
      renderTabs();
      renderList();
    }

    (async function boot() {
      const me = await C4K.loadMe();
      if (me && me.role === 'super_admin') { init(); }
      else { document.getElementById('etLoginBox').style.display = ''; }
    })();
  </script>
</body>
</html>
