name: Deploy to Cloudflare (production)

# Publishes the live site automatically.
#  • Runs every time code lands on the main branch (e.g. when you merge on GitHub).
#  • Can also be started by hand from the Actions tab ("Run workflow") as a manual deploy button.
#
# Database migrations run BEFORE the deploy, so the schema and the code always ship
# together. They used to be a manual step someone had to remember to run first, and
# merging without it meant endpoints 500ing against a database that couldn't serve them.
#
# One-time setup required: add a repository secret named CLOUDFLARE_API_TOKEN
# (Settings → Secrets and variables → Actions). The token needs BOTH "Workers Scripts:
# Edit" (to deploy) and "D1: Edit" (to migrate). If the migrate step fails with a
# permissions error, that's the missing scope.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Runs first on purpose: if a migration fails, nothing is deployed, so the site
      # keeps serving the old code against the old schema instead of new code against
      # a database that hasn't caught up.
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 cloudflare/migrate.py --database kidvibers

      # Mirror cloudflare/deploy.sh: the live site is served from cloudflare/public/,
      # which is built from the project's root files (it isn't stored in git).
      - name: Build the public/ assets folder
        run: |
          cd cloudflare
          rm -rf public && mkdir -p public
          # Copy every root asset by extension rather than naming files one by one.
          # The old allowlist had silently gone stale twice: analytics.js was never
          # deployed at all (so every page 404'd on it, taking Consent Mode, the
          # cookie banner, Clarity and GTM with it), and tour.js was missing here
          # while present in deploy.sh. An allowlist that must be updated by hand
          # every time a file is added will keep drifting; this cannot.
          cp ../*.html ../*.js ../*.css ../*.json ../*.txt ../*.xml ../*.svg ../*.png public/ 2>/dev/null || true
          # Generated landing pages live in subdirectories, so the globs above miss them.
          cp -R ../p public/ 2>/dev/null || true
          # safety: never ship secrets or server-only files
          rm -f public/data.db public/admin_config.json public/server.py public/test_email.py 2>/dev/null || true
          # Fail loudly rather than deploying a site missing its own scripts.
          for f in analytics.js app.js auth.js styles.css index.html sitemap.xml; do
            [ -f "public/$f" ] || { echo "::error::public/$f missing — refusing to deploy"; exit 1; }
          done

          # Cache-bust every asset with this commit's SHA.
          #
          # Script and stylesheet tags carry a hand-maintained "?v=NNN". That number is a
          # promise to the browser that the file behind the URL hasn't changed, so a visitor
          # who has been here before keeps running the CACHED copy until it moves. Nobody
          # remembers to bump it, so shipped fixes were invisible to exactly the people who
          # use the site most — a whole day's work could land and returning users would see
          # none of it, with no error anywhere to explain why.
          #
          # Rewriting it to the commit SHA at build time makes it change automatically on
          # every deploy that touches anything, and never change when nothing ships.
          SHA_SHORT="${GITHUB_SHA::8}"
          find public -name '*.html' -print0 | xargs -0 sed -i "s/?v=[0-9][0-9]*/?v=${SHA_SHORT}/g"
          echo "Cache-busted assets to ?v=${SHA_SHORT}"
          grep -oh '?v=[a-z0-9]*' public/index.html | sort -u | head -3

          echo "Built public/ with:" && ls public/

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy

      # A green deploy only means Cloudflare accepted the upload — it says nothing about
      # whether the site still works. These checks hit the live site read-only and fail the
      # run loudly if a page 404s, an auth gate stops rejecting anonymous requests, quiz
      # answers leak into the public payload, or a security header goes missing.
      #
      # It runs after the deploy rather than before because there is nothing to test until
      # the new code is actually serving. A failure here means the deploy that just happened
      # broke something, which is exactly the moment you want to know.
      - name: Smoke test the live site
        run: |
          echo "Waiting a few seconds for the new version to be serving…"
          sleep 15
          bash cloudflare/smoke.sh https://kidvibers.com
